[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-redeeme"
version = "0.1.0"
description = "「兑了么 DD RedeeMe」游戏兑换码 Windows 桌面挂件"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.6", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
